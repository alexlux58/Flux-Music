name: checks

"on":
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      PANDOC_VERSION: "3.12"
      PANDOC_SHA256: "67d7d011fed8c8543306022b985b9b2499ab9b74818df91d8727c7e9ebc5ba06"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Qt platform dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 ffmpeg fonts-dejavu-core libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install application and test tools
        run: python -m pip install -e '.[dev]'
      - name: Lint, test and bootstrap
        run: make check PYTHON=python
      - name: Install pinned documentation tools
        run: |
          url="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/pandoc.tar.gz" "$url"
          echo "${PANDOC_SHA256}  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum --check -
          sudo tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C /usr/local --strip-components=1
          python -m pip install -r tools/docs-build/requirements.txt
      - name: Check and build walkthrough
        run: |
          python tools/docs-build/build.py --check
          python tools/docs-build/build.py
